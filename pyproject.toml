[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeprice"
version = "0.1.0"
description = "Forecast Pokémon card prices with ML, using popularity, nostalgia, rarity, hype and market factors."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "shap>=0.45",
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "streamlit>=1.60",
  "plotly>=5.20",
  "joblib>=1.3",
  "pytrends>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["pokeprice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
